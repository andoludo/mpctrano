# The house of the tutorials before renovation: uninsulated cavity walls, double glazing of the 1980s and a
# slab without insulation; a 7 kW heat pump at 55 degC supply with a 300 l buffer and a radiator sized for
# 55/45 degC.
default: !include_default
spaces:
  - occupancy:
      parameters:
        occupancy: 3600*{7, 22}
        gain: "[40; 75; 40]"
        heat_gain_if_occupied: 1/7/3
    parameters:
      floor_area: 100.0
      average_room_height: 2.5
    id: SPACE:001
    external_boundaries:
      external_walls:
        - surface: 20
          azimuth: 0
          tilt: wall
          construction: CAVITYWALLEMPTY:001
        - surface: 30
          azimuth: 1.57
          tilt: wall
          construction: CAVITYWALLEMPTY:001
        - surface: 50
          azimuth: 3.14
          tilt: wall
          construction: CAVITYWALLEMPTY:001
      windows:
        - surface: 5.0
          construction: EPCDOUBLE:001
          azimuth: 0
          tilt: wall
        - surface: 2.0
          construction: EPCDOUBLE:001
          azimuth: 3.14
          tilt: wall
      floor_on_grounds:
        - surface: 50.0
          construction: FLOORONGROUNDUNINSULATED:001
    emissions:
      - radiator:
          id: RADIATOR:001
          # radiator sized for 55/45 degC
          parameters:
            nominal_heating_power_positive_for_heating: 7000
            water_inlet_temperature_at_nominal_condition: 328.15
            water_outlet_temperature_at_nominal_condition: 318.15
            air_temperature_at_nominal_condition: 293.15
      - valve:
          id: VALVE:001
          control:
            emission_control:
              id: EMISSION_CONTROL:001
              parameters:
                schedule: 3600*{7, 22}
                temperature_heating_setpoint: 294.15
                temperature_heating_setback: 290.15
systems:
  - boiler:
      id: BOILER:001
      variant: air_water_heat_pump
      # 7 kW at -8 degC outdoor and 55 degC supply, 300 l buffer
      parameters:
        nominal_heating_power: 7000
        temperature_supply_setpoint_heat_pump: 328.15
        use_storage_tank: true
        tank_volume: 0.3
        height_of_tank_without_insulation: 1.0
      control:
        boiler_control:
          id: BOILER_CONTROL:001
          variant: simple
      inlets:
        - SPLIT_VALVE:002
  - pump:
      id: PUMP:001
      parameters:
        m_flow_nominal: 0.17
      control:
        collector_control:
      inlets:
        - BOILER:001
  - three_way_valve:
      id: THREE_WAY_VALVE:001
      parameters:
        m_flow_nominal: 0.17
      control:
        three_way_valve_control:
      inlets:
        - SPLIT_VALVE:002
        - PUMP:001
      outlets:
        - TEMPERATURE_SENSOR:001
  - temperature_sensor:
      id: TEMPERATURE_SENSOR:001
      outlets:
        - RADIATOR:001
  - split_valve:
      id: SPLIT_VALVE:002
      inlets:
        - VALVE:001
      outlets:
        - BOILER:001
