site_name: mpctrano
site_description: Calibration, state estimation and economic MPC of the FastModel building models of Trano
repo_name: mpctrano
repo_url: https://github.com/andoludo/mpctrano
theme:
  name: material
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/lightbulb
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/lightbulb-outline
        name: Switch to light mode
  features:
    - content.code.annotate
    - content.code.copy
    - navigation.footer
    - navigation.instant
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  icon:
    repo: fontawesome/brands/github-alt
  language: en
plugins:
  - search
  - mkdocs-jupyter:
      execute: false
      include_source: true
      include_requirejs: true
      ignore_h1_titles: true
nav:
  - Workflow: index.md
  - Monitoring data: data.md
  - Calibration: calibration.md
  - State estimation: estimation.md
  - MPC, tariffs and flexibility: mpc.md
  - Tutorials:
      - About the tutorials: tutorials/index.md
      - 00 Setup check: tutorials/00_setup_check.ipynb
      - 01 A house with a heat pump: tutorials/01_house_heat_pump.ipynb
      - 02 Flexibility use cases: tutorials/02_flexibility_use_cases.ipynb
      - 04 An office in summer: tutorials/04_office_cooling.ipynb
      - 05 PV, battery and vehicle: tutorials/05_pv_battery_ev.ipynb
markdown_extensions:
  - admonition
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
