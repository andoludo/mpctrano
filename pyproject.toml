[project]
name = "mpctrano"
version = "0.1.0"
description = "Calibration, state estimation and economic model predictive control of the FastModel building models generated by Trano (rumoca + CasADi + IPOPT)."
authors = [{ name = "Ando Andriamamonjy", email = "andoludovic.andriamamonjy@gmail.com" }]
requires-python = ">=3.11,<4.0"
readme = "README.md"
license = { text = "LGPL-3.0-or-later" }
keywords = ["model predictive control", "building", "calibration", "state estimation", "modelica", "casadi", "ipopt", "trano"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "trano>=0.48.0",
    "rumoca>=0.10.3,<0.11",
    "casadi>=3.6.7,<4",
    "numpy>=1.26",
    "pandas>=2.2.2,<3",
    "pydantic>=2.7,<3",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
plot = ["plotly>=5.22"]
notebook = [
    "ipywidgets>=8.1",
    "plotly>=5.22",
]

[project.urls]
Repository = "https://github.com/andoludo/mpctrano"

[project.scripts]
mpctrano = "mpctrano.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pandas-stubs>=2.2.0.240218",
    "plotly>=5.22",
    "jupyterlab>=4.6.4",
    "ipywidgets>=8.1.9",
    "jupytext>=1.19.6",
    "nbmake>=1.5.5",
    "pre-commit>=4.6.2",
    "pyarrow>=25.0.1",
]

docs = [
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.5.42,<10",
]

[tool.uv]
default-groups = "all"

[tool.uv.sources]
# The CasADi export of the connected FastModel models needs rumoca main up to c74cddf (0.10.3, not on PyPI yet;
# later commits stop at residual equations): uv builds it from source (Rust toolchain needed).
rumoca = { git = "https://github.com/CogniPilot/rumoca", rev = "c74cddff6d7669fc2c3603d43529ab62e0964072", subdirectory = "crates/rumoca-bind-python" }

[tool.uv.build-backend]
module-root = ""
source-include = ["LICENSE"]

[build-system]
requires = ["uv_build>=0.8.0,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: longer closed-loop scenarios (deselect with -m 'not slow')",
]

[tool.jupytext]
# Every tutorial notebook is paired with a percent-format script: edit either, `make sync-notebooks` keeps them equal.
formats = "ipynb,py:percent"
notebook_metadata_filter = "-all"
cell_metadata_filter = "-all"

[tool.mypy]
plugins = "pydantic.mypy"
packages = "mpctrano"
follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true
disallow_untyped_defs = true
strict = true

[[tool.mypy.overrides]]
module = ["casadi", "casadi.*", "rumoca", "rumoca.*", "plotly", "plotly.*", "trano", "trano.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
exclude = [".git", ".venv", "build", "dist", "docs", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "W", "F", "B006", "RUF", "UP", "SIM", "FURB", "PIE", "PERF", "C4", "B", "PL", "S", "C901", "N", "ANN", "ERA001", "PD"]
ignore = ["UP006", "UP035", "S101", "PLR2004", "W291", "PLC0415", "PLR0913", "PLR0917", "N806"]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "PLR", "S", "D"]
"tutorials/**" = ["ANN", "PLR", "S", "T201", "E402", "ERA001", "N999", "INP001"]
